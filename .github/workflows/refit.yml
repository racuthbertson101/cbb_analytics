name: refit
# Manual: re-estimate hyperparameters and all model artifacts after each season (or after a data fix). Slow (about 40 minutes).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refit:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Download warehouse
        run: uv run python -m pipeline.release download
      - name: Refit everything
        run: make ratings
      - name: Upload artifacts
        run: uv run python -m pipeline.release upload
      - name: Commit refreshed parameters and evidence
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add pipeline/params config
          git diff --cached --quiet || git commit -m "Refit parameters after season"
          git push
